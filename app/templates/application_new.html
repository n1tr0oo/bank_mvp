{% extends "base.html" %}
{% block title %}Новая заявка — Bank Credit MVP{% endblock %}
{% block content %}
<div class="card">
  <h2>Новая кредитная заявка</h2>
  <form action="/ui/applications/new" method="post">
    <div class="form-row">
      <label for="amount">Сумма (₸)</label>
      <input type="number" id="amount" name="amount" min="1" max="10000000" step="0.01" required
             value="{{ amount|default('') }}">
      <small class="muted">от 1 до 10 000 000.</small>
    </div>
    <div class="form-row">
      <label for="term_months">Срок (мес.)</label>
      <input type="number" id="term_months" name="term_months" min="1" max="360" required
             value="{{ term_months|default('12') }}">
    </div>
    <div class="form-row">
      <label for="purpose">Цель кредита</label>
      <textarea id="purpose" name="purpose" rows="3" minlength="10" maxlength="500" required>{{ purpose|default('') }}</textarea>
      <small class="muted">10–500 символов.</small>
    </div>
    <div class="actions">
      <button class="btn" type="submit">Подать заявку</button>
      <a class="btn secondary" href="/ui/applications">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
