{% extends "base.html" %}
{% block content %}
<h2>Заявки</h2>
<form method="get" action="/search">
  <input name="q" placeholder="поиск по цели заявки">
  <button>Искать</button>
</form>
<table border="1" cellpadding="6">
  <tr><th>#</th><th>Клиент</th><th>Сумма</th><th>Срок</th><th>Цель</th><th>Статус</th><th></th></tr>
  {% for a in apps %}
  <tr>
    <td>{{ a['id'] }}</td>
    <td>{{ a['client_id'] }}</td>
    <td>{{ a['amount'] }}</td>
    <td>{{ a['term_months'] }}</td>
    <td>{{ a['purpose'] }}</td>
    <td>{{ a['status'] }}</td>
    <td><a href="/apps/{{ a['id'] }}">Открыть</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
