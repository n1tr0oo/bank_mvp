{% extends "base.html" %}
{% block content %}
<h2>Новая заявка</h2>
<form method="post">
  <label>Сумма <input type="number" name="amount" step="0.01" required></label>
  <label>Срок (мес.) <input type="number" name="term_months" required></label>
  <label>Цель <textarea name="purpose" required></textarea></label>
  <button>Подать</button>
</form>
{% endblock %}
